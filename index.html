header h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800}
header p{margin:4px 0 0;color:var(--muted);max-width:60ch;font-size:.95rem;line-height:1.35}
nav{display:flex;flex-direction:column;gap:8px;padding:6px 0 14px}.hint{color:var(--muted);font-size:.92rem;margin:2px 4px 0}.ico{margin-right:6px}nav button .badge{margin-left:6px}.navrow{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:2px}
nav button,.pill{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true],.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.badge{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.8rem}
.ages{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 18px}
.ages b{margin-right:4px}
.pill{padding:7px 14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.ex h3{font-size:1.15rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-size:.82rem}
.dbadge{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:54px;padding:5px 9px;border-radius:12px;background:var(--accent);color:var(--accent-ink);line-height:1.05;text-transform:uppercase;font-size:.68rem;font-weight:700;letter-spacing:.04em;margin-right:12px;flex:none}.dbadge b{font-size:1.45rem;letter-spacing:0}.dbadge .yr{font-size:.55rem;opacity:.8;letter-spacing:.08em;font-weight:600;margin-top:1px}
.h2d{display:flex;align-items:center;flex-wrap:wrap}.h2d>span{min-width:0}
.attgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:10px 0}.atti{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-height:44px}.atti input{width:22px;height:22px;flex:none;accent-color:var(--court)}.atti:has(input:checked){border-color:var(--court);background:color-mix(in srgb,var(--court) 12%,var(--surface))}
.mq{appearance:none;-webkit-appearance:none;display:block;margin:0 auto;width:100%;max-width:30px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;position:relative}.mq:checked{background:var(--court);border-color:var(--court)}.mq:checked::after{content:"";position:absolute;left:50%;top:44%;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(-50%,-50%) rotate(45deg)}.mq:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.bn{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 5px;border-radius:13px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.8rem;flex:none}.bn.e{background:var(--line);color:var(--muted)}

/* ===== Sistema de disseny v2: neutre + un accent (taronja bàsquet) ===== */
:root{--bg:#F6F6F3;--surface:#FFFFFF;--ink:#0F0F0E;--muted:#6C6C66;--line:#E6E6E1;--chip:#EFEFEB;--accent:#FF5B14;--accent-ink:#140A04;--focus:#E04400;--court:#0F0F0E;--warn:#C8372D;--r:12px;--ease:cubic-bezier(.2,.7,.2,1)}

:root[data-theme="dark"]{--bg:#0C0C0C;--surface:#151515;--ink:#F3F3F1;--muted:#9A9A94;--line:#262626;--chip:#1E1E1E;--accent:#FF6A24;--accent-ink:#140A04;--focus:#FF6A24;--court:#F3F3F1;--warn:#F2766B}
body{font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
h1,h2,h3{font-family:Inter,system-ui,sans-serif;font-weight:650;letter-spacing:-.015em;line-height:1.2}
h2{font-size:1.25rem}h3{font-size:1rem}
.wrap{max-width:1240px;padding:0 20px 64px}
/* --- marca i barra lateral --- */
.side{padding:14px 0 6px}
.langbar{justify-content:flex-start;gap:2px;margin:0 0 10px;order:9}
.langbar .pill{border:0;background:transparent;color:var(--muted);padding:3px 8px;font-size:.78rem;font-weight:600;border-radius:6px}
.langbar .pill[aria-pressed=true]{background:var(--chip);color:var(--ink)}
header{border:0;margin:0;padding:4px 0 14px}
.brand{gap:10px}.brandlogo{width:34px;height:34px;box-shadow:none}
header h1{font-family:'Barlow Condensed',Inter,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:1.2rem;line-height:1.05}
header p{display:none}
.wrap:has(#view .hero) #hp{display:block;font-size:.85rem;margin-top:6px;max-width:34ch}
nav{gap:0;padding:0}
.navrow{display:flex;flex-direction:column;gap:2px;padding:0}
.navrow+.navrow{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-weight:500;font-size:.92rem;color:var(--muted);background:transparent;border:0;border-radius:8px;padding:8px 10px;box-shadow:none;transition:background .15s var(--ease),color .15s var(--ease)}
nav button .ico{margin:0;display:inline-flex;color:inherit;opacity:.9}
nav button:hover{background:var(--chip);color:var(--ink)}
nav button[aria-selected=true]{background:var(--chip);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
nav button[aria-selected=true] .ico{color:var(--accent)}
nav button .badge{margin-left:auto}
.badge{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.72rem;padding:0 6px;min-width:20px;text-align:center;line-height:18px;border-radius:99px}
.hint{font-size:.82rem;margin:12px 4px 0;line-height:1.4}
/* --- barra de context (equip) --- */
#team{grid-column:2}
.teambar{margin:0 0 14px;padding:0 0 12px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--muted);font-size:.9rem;gap:8px 12px}
.teambar b{color:var(--ink);font-weight:650}
.alertbar{border-radius:10px;background:var(--chip);color:var(--ink);border:1px solid var(--line);font-weight:500;margin:0 0 12px}
.clogo{height:24px;border-radius:4px;margin-right:6px}
/* --- pestanyes d'edat --- */
.ages{gap:6px;margin:0 0 20px;align-items:center}
.ages b{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-right:6px}
.pill{font-weight:500;font-size:.86rem;padding:6px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;transition:all .15s var(--ease)}
.pill:hover{border-color:var(--muted)}
.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* --- components --- */
.panel.noprint:has(>.row:only-child>.btn:only-child){background:none;border:0;padding:0 0 4px}
.panel>h2:first-child{margin-bottom:14px}
.teambar>span{flex:1;min-width:0}
.navs{display:block}

.ex:hover{border-color:color-mix(in srgb,var(--ink) 28%,var(--line))}
.grid{gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.btn{font-weight:600;font-size:.9rem;border-radius:8px;padding:9px 16px;background:var(--accent);color:var(--accent-ink);border:1px solid transparent;transition:filter .15s var(--ease),background .15s var(--ease),border-color .15s var(--ease)}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:translateY(.5px)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:var(--chip);filter:none;border-color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn.dng{background:var(--warn);color:#fff}

input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
label{font-weight:500;font-size:.8rem;color:var(--muted);gap:5px}
.tag{background:var(--chip);color:var(--ink);font-weight:500;font-size:.78rem;padding:2px 9px}
.tag.c{background:var(--ink);color:var(--bg)}
.tags{gap:5px}
.empty{color:var(--muted)}
.row{gap:12px}
/* --- marcador de data (estil taulell) --- */
.dbadge{background:var(--ink);color:var(--bg);border-radius:10px;min-width:52px;padding:6px 8px;font-family:Inter,sans-serif;font-weight:600;font-size:.6rem;letter-spacing:.1em}
.dbadge b{font-family:'Barlow Condensed',Inter,sans-serif;font-weight:700;font-size:1.65rem;line-height:1;letter-spacing:0}
.dbadge .yr{opacity:.6;font-size:.55rem}
.h2d{gap:0}
/* --- taules i llistes --- */
.atwrap{border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.attab th,.attab td{border-bottom:1px solid var(--line)}
.attab thead th{background:transparent;color:var(--muted);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.attab tbody tr:last-child td{border-bottom:0}
.attab tbody tr:hover td{background:var(--chip)}
.attab tfoot td{background:transparent;color:var(--muted);font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.attab th:first-child,.attab td:first-child{background:var(--surface)}
.attab tbody tr:hover td:first-child{background:var(--chip)}
.lugw{border-radius:var(--r);background:var(--surface)}
.lug thead th.sp,.lug tfoot td.sp{background:linear-gradient(var(--line),var(--line)) center/2px 100% no-repeat,transparent}
.item{border-top:1px solid var(--line);padding:12px 0}
.sess{border-top:1px solid var(--line)}
/* --- indicadors --- */
.bn{background:var(--accent);color:var(--accent-ink);font-family:'Barlow Condensed',Inter,sans-serif;font-weight:700;font-size:.95rem}
.bn.e{background:var(--chip);color:var(--muted)}
.fill{background:var(--accent)}
.track{background:var(--chip)}
.mq:checked,.lug .mq:checked+i{background:var(--ink);border-color:var(--ink)}
.mq:checked::after{border-color:var(--bg)}
.lug .mq:checked+i::before,.lug .mq:checked+i::after{background:var(--bg)}
.lug i{border-color:var(--line)}
.pc2{border-radius:10px;border:1px solid var(--line)}
.pc2:has(.pcn input:checked){border-color:color-mix(in srgb,var(--ink) 45%,var(--line));background:var(--chip)}
.pc2 .pn{background:var(--surface);border:1px solid var(--line);border-radius:8px;font-family:'Barlow Condensed',Inter,sans-serif;font-weight:700;font-size:1.1rem}
.pc2 .pn:focus{border-color:var(--accent)}
.pcn span::before{color:var(--accent)}
.atti{border:1px solid var(--line);border-radius:10px}.atti:has(input:checked){border-color:color-mix(in srgb,var(--ink) 45%,var(--line));background:var(--chip)}.atti input{accent-color:var(--ink)}
.opt{border-radius:10px}
.note{background:var(--chip);color:var(--ink);border-left:3px solid var(--accent);border-radius:6px}
.lt{font-weight:600;font-size:.8rem}
/* --- modals i avisos --- */
.mdl{background:rgba(10,10,10,.55)}
.mdl .mbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.toast{background:var(--ink);color:var(--bg);font-weight:500;border-radius:10px;padding:10px 16px;box-shadow:0 8px 30px rgba(0,0,0,.25);transition:opacity .2s var(--ease),transform .2s var(--ease)}
/* --- pantalla d'accés --- */
.hero{margin:28px 0 20px}
.herologo{box-shadow:none}
/* --- diagrames: es manté el color de pista --- */
#ed{border-radius:var(--r)}
/* ===== Escriptori: barra lateral ===== */
@media (min-width:960px){
.wrap{display:grid;grid-template-columns:232px minmax(0,1fr);column-gap:48px;align-items:start}
.side{grid-column:1;grid-row:1/span 4;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:22px 0 20px}
header{padding:0 0 22px}
header h1{font-size:1.15rem}
#team,#ages,main{grid-column:2}
#team:empty{display:none}
#team{padding-top:22px}
main{min-height:60vh}
.langbar{margin:auto 0 0;padding-top:16px}
}
/* ===== Mòbil / tauleta: pestanyes horitzontals ===== */
@media (max-width:959px){
.fabb{position:fixed!important;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink)!important;color:var(--bg)!important;border:0!important;border-radius:999px!important;padding:13px 20px!important;font-size:.95rem!important;box-shadow:0 6px 22px rgba(0,0,0,.3)}
.wrap{display:flex;flex-direction:column;padding:0 16px 56px}
.side{display:contents}
header{order:1;padding:14px 0 8px}
header h1{white-space:nowrap}
#team{order:2}.teambar{margin:0 0 6px;padding:6px 0 10px}
.teambar{display:flex;flex-wrap:nowrap;align-items:flex-start;font-size:.82rem}
.teambar>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.teambar .btn{flex:none}
nav{order:3;margin:0 -16px 14px;padding:0}
.navs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 12px;border-bottom:1px solid var(--line);-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.navs::-webkit-scrollbar{display:none}
.navrow,.navrow+.navrow{display:contents}
.navrow+.navrow>button:first-child{margin-left:10px}
nav button{width:auto;flex:none;border-radius:0;padding:12px 11px;gap:7px;background:transparent;box-shadow:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav button:hover{background:transparent}
nav button[aria-selected=true]{background:transparent;box-shadow:none;border-bottom-color:var(--accent)}
nav button .badge{margin-left:2px}
.hint{display:block;padding:10px 16px 0;margin:0}
.ages{order:4;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;margin-bottom:16px}.ages::-webkit-scrollbar{display:none}.ages .pill,.ages b{flex:none}
main{order:5}
.langbar{order:9;justify-content:center;margin:28px 0 0}
.panel{padding:16px}
}
/* ===== Pantalles d'accés: columna centrada ===== */
#team:empty,#ages:empty,nav:empty{display:none!important}
.wrap:has(#view .hero){display:flex;flex-direction:column;max-width:520px;padding-top:0}
.wrap:has(#view .hero) .side{display:contents}
.wrap:has(#view .hero) .langbar{order:0;margin:16px 0 0;justify-content:flex-end;padding:0}
.wrap:has(#view .hero) main{order:1;min-height:0}
.wrap:has(#view .hero) header{order:2;text-align:center;padding:20px 0}
.wrap:has(#view .hero) .brandlogo,.wrap:has(#view .hero) header h1{display:none}
.wrap:has(#view .hero) .brand{justify-content:center}
.wrap:has(#view .hero) #hp{max-width:none;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.side{display:none}}

:root{--act:#1F4E8C;--actbg:#E3ECF8;--actink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--act:#7FAEEF;--actbg:#1B2638;--actink:#10151D}}
:root[data-theme="dark"]{--act:#7FAEEF;--actbg:#1B2638;--actink:#10151D}
.ex.act{border:2px solid var(--act);background:linear-gradient(180deg,var(--actbg) 0,var(--surface) 70%)}
.actband{display:flex;align-items:center;gap:8px;margin:-16px -16px 2px;padding:8px 16px;background:var(--act);color:var(--actink);font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;border-radius:9px 9px 0 0}
.actdot{width:10px;height:10px;border-radius:50%;background:var(--actink);box-shadow:0 0 0 3px color-mix(in srgb,var(--actink) 35%,transparent)}
.thd{display:flex;align-items:center;justify-content:space-between;gap:10px}.thd h3{margin:0}.btn.sm.use{white-space:nowrap}
body.superonly [data-act=add]{display:none!important}

r amb les mans avall.", "Defensor activo con una mano.": "Defensor actiu amb una mà.", "La sombra": "L'ombra", "Uno bota por una línea, el otro se desliza frente a él en posición defensiva sin cruzar los pies.": "Un bota per una línia, l'altre es desplaça davant seu en posició defensiva sense creuar els peus.", "Alternar rápidos y lentos.": "Alternar ràpids i lents.", "Líneas del campo": "Línies del camp", "Deslizamientos en zigzag": "Desplaçaments en ziga-zaga", "Defender sobre una línea de conos con pasos laterales, cambio de sentido a la señal del entrenador.": "Defensar sobre una línia de cons amb passos laterals, canvi de sentit al senyal de l'entrenador.", "Añadir un jugador de ataque.": "Afegir un jugador d'atac.", "Conos": "Cons", "1x1 medio campo limitado": "1x1 mig camp limitat", "El atacante parte de una zona y tiene 6 segundos. Defensa: ponerse entre el balón y el aro y forzar hacia el lado.": "L'atacant surt d'una zona i té 6 segons. Defensa: posar-se entre la pilota i l'anella i forçar cap al costat.", "Marcar quién ataca más de 5 veces.": "Marcar qui ataca més de 5 vegades.", "Rebote y bloqueo del contrario": "Rebot i bloqueig del contrari", "Tras el tiro, cada defensor busca contacto, bloquea al atacante y rebotea con dos manos.": "Després del tir, cada defensor busca contacte, bloqueja l'atacant i rebota amb les dues mans.", "Penalización por rebote cedido.": "Penalització per rebot cedit.", "Balón, aro": "Pilota, anella", "Mini 3x3 con regla de pase": "Mini 3x3 amb regla de passada", "Tres contra tres a una canasta. Antes de tirar deben tocar el balón los tres. Canasta vale 2, pase extra suma 1.": "Tres contra tres a una cistella. Abans de tirar han de tocar la pilota els tres. La cistella val 2, passada extra suma 1.", "Quitar el bote a los más avanzados.": "Treure el bot als més avançats.", "Balones, aros": "Pilotes, anelles", "Grupos de 6": "Grups de 6", "Relevos con balón": "Relleus amb pilota", "Carreras de relevos botando, con zonas de pase o tiro. Cada equipo suma puntos por acierto.": "Curses de relleus botant, amb zones de passada o tir. Cada equip suma punts per encert.", "Cambiar el tipo de bote por vuelta.": "Canviar el tipus de bot per volta.", "2x2 y 3x3 con espacios": "2x2 i 3x3 amb espais", "Juego con reglas: tras pasar hay que cortar o ocupar otro espacio. Cada 3 minutos se rota.": "Joc amb regles: després de passar cal tallar o ocupar un altre espai. Cada 3 minuts es rota.", "Cada jugador pasa por una posición diferente.": "Cada jugador passa per una posició diferent.", "Grupos": "Grups", "5x5 con reglas pedagógicas": "5x5 amb regles pedagògiques", "Partido con una regla de aprendizaje por bloque (todos tocan balón, defensa individual, contraataque).": "Partit amb una regla d'aprenentatge per bloc (tots toquen pilota, defensa individual, contraatac).", "Cambiar la regla cada 5 minutos.": "Canviar la regla cada 5 minuts.", "Estiramientos y respiración": "Estiraments i respiració", "Estiramientos suaves de piernas, espalda y hombros. Un jugador propone cómo ha ido el entrenamiento.": "Estiraments suaus de cames, esquena i espatlles. Un jugador proposa com ha anat l'entrenament.", "Cada uno dice una cosa que ha aprendido.": "Cadascú diu una cosa que ha après.", "Círculo": "Cercle", "Reto de tiros libres": "Repte de tirs lliures", "Cada jugador lanza 5 tiros desde su distancia y compara con su marca anterior.": "Cada jugador llança 5 tirs des de la seva distància i es compara amb la seva marca anterior.", "Subir la distancia al acertar 4.": "Pujar la distància en encertar 4.", "Seguir al líder con balón": "Seguir el líder amb pilota", "El líder bota y cambia de ritmo, de mano y de dirección; el resto lo imita. Cambio de líder cada minuto.": "El líder bota i canvia de ritme, de mà i de direcció; la resta l'imita. Canvi de líder cada minut.", "El líder añade saltos y giros.": "El líder afegeix salts i girs.", "Rueda de pases en movimiento": "Roda de passades en moviment", "Corriendo en cuadrado, pasan al compañero de delante y siguen al puesto del receptor.": "Corrent en quadrat, passen al company de davant i segueixen fins al lloc del receptor.", "Dos balones a la vez.": "Dues pilotes alhora.", "Calentamiento con aros y saltos": "Escalfament amb anelles i salts", "Saltar de aro en aro a pies juntos, a un pie y laterales. Con balón en las manos al final.": "Saltar d'anella en anella a peus junts, a peu coix i laterals. Amb pilota a les mans al final.", "Añadir bote entre aros.": "Afegir bot entre anelles.", "Aros de suelo": "Anelles de terra", "Bote y calentamiento con tiros": "Bot i escalfament amb tirs", "Dos minutos de bote dinámico, después tiros cercanos progresivos para activar la mecánica.": "Dos minuts de bot dinàmic, després tirs propers progressius per activar la mecànica.", "Tiro tras parada en dos tiempos.": "Tir després de parada en dos temps.", "Bote reactivo a la señal": "Bot reactiu al senyal", "El entrenador muestra una mano: el jugador bota con esa mano y se desplaza al lado indicado.": "L'entrenador mostra una mà: el jugador bota amb aquesta mà i es desplaça cap al costat indicat.", "Dos señales a la vez (mano y dirección).": "Dos senyals alhora (mà i direcció).", "Bote con la mano débil": "Bot amb la mà dèbil", "Bote solo con la mano menos hábil: recto, en zigzag y rodeando conos. Se anotan los conos sin fallos.": "Bot només amb la mà menys hàbil: recte, en ziga-zaga i voltant cons. S'anoten els cons sense errors.", "Cada pareja se reta a superar su marca.": "Cada parella es repta a superar la seva marca.", "Bote con dos balones": "Bot amb dues pilotes", "Botar los dos balones a la vez y después alternados; andar adelante y atrás.": "Botar les dues pilotes alhora i després alternades; caminar endavant i enrere.", "Cambio de balones entre compañeros.": "Canvi de pilotes entre companys.", "2 balones por jugador": "2 pilotes per jugador", "Carrera de botes con obstáculos": "Cursa de bots amb obstacles", "Circuito botando: pasar por encima de aros, bajo una pica y entre conos. Gana el equipo más rápido sin pérdidas.": "Circuit botant: passar per sobre d'anelles, sota una pica i entre cons. Guanya l'equip més ràpid sense pèrdues.", "Cambiar de mano en cada obstáculo.": "Canviar de mà a cada obstacle.", "Conos, picas, aros": "Cons, piques, anelles", "Bote protegido ante defensor": "Bot protegit davant del defensor", "El atacante bota protegiendo el balón con el cuerpo mientras el defensor intenta tocarlo con una mano.": "L'atacant bota protegint la pilota amb el cos mentre el defensor intenta tocar-la amb una mà.", "Diana de pases": "Diana de passades", "Pasar a un aro colgado o pintado en la pared y recoger el rebote. Contar los aciertos.": "Passar a una anella penjada o pintada a la paret i recollir el rebot. Comptar els encerts.", "Alejar la distancia a los 3 aciertos seguidos.": "Allunyar la distància als 3 encerts seguits.", "Aros, balones": "Anelles, pilotes", "Pase en triángulo": "Passada en triangle", "Tres jugadores en triángulo: pase y movimiento hacia el siguiente puesto, siempre con un compañero libre.": "Tres jugadors en triangle: passada i moviment cap al lloc següent, sempre amb un company lliure.", "Añadir un defensor pasivo en el centro.": "Afegir un defensor passiu al centre.", "Grupos de 3": "Grups de 3", "Pase por encima del defensor": "Passada per sobre del defensor", "Un defensor con brazos abiertos en el centro; los dos pasadores usan pase picado y pase por encima de la cabeza.": "Un defensor amb els braços oberts al centre; els dos passadors usen passada picada i passada per sobre del cap.", "Defensor activo a medio ritmo.": "Defensor actiu a mig ritme.", "Pase con una mano": "Passada amb una mà", "Pase largo con una mano, pasando con paso adelante y sin perder el equilibrio.": "Passada llarga amb una mà, passant amb pas endavant i sense perdre l'equilibri.", "Pasar tras un bote.": "Passar després d'un bot.", "Pase y lateral": "Passada i lateral", "Se pasan con un paso lateral entr ": "Bandeja alternant mans", "Una fila entra por la derecha y otra por la izquierda. Se alternan cada intento para trabajar ambas manos.": "Una fila entra per la dreta i una altra per l'esquerra. S'alternen a cada intent per treballar les dues mans.", "Añadir bote antes de la entrada.": "Afegir bot abans de l'entrada.", "Entrada con cambio de mano": "Entrada amb canvi de mà", "Bote hacia el cono, cambio de mano y entrada a canasta con la mano más lejana al defensor.": "Bot cap al con, canvi de mà i entrada a cistella amb la mà més llunyana al defensor.", "Defensor pasivo con la mano levantada.": "Defensor passiu amb la mà aixecada.", "Conos, aro": "Cons, anella", "Recepción en carrera y bandeja": "Recepció en cursa i bandeja", "Cortar al aro, recibir en carrera con paso de ajuste y finalizar. Después rebote y cambio de rol.": "Tallar cap a l'anella, rebre en cursa amb pas d'ajust i finalitzar. Després rebot i canvi de rol.", "Pase desde los dos lados.": "Passada des dels dos costats.", "Atrapa el pañuelo": "Atrapa el mocador", "Dos equipos frente a frente; al llamar un número, los dos jugadores corren al centro y botan antes de volver.": "Dos equips cara a cara; en cridar un número, els dos jugadors corren al centre i boten abans de tornar.", "Hacerlo con balón.": "Fer-ho amb pilota.", "1 pañuelo": "1 mocador", "Dos equipos": "Dos equips", "Defensa de pasillo": "Defensa de passadís", "El atacante intenta cruzar un pasillo de 3 metros y el defensor lo cierra con deslizamientos.": "L'atacant intenta creuar un passadís de 3 metres i el defensor el tanca amb desplaçaments.", "Reducir el ancho del pasillo.": "Reduir l'amplada del passadís.", "Manos activas": "Mans actives", "Defensa con manos arriba y abajo: robar con las manos en la línea de pase sin saltar encima del atacante.": "Defensa amb mans amunt i avall: robar amb les mans a la línia de passada sense saltar a sobre de l'atacant.", "Añadir una puntuación por robo limpio.": "Afegir una puntuació per robatori net." ve en círculo": "Passada suau en cercle", "Pase tranquilo y respiración profunda entre jugadores; el balón no debe tocar el suelo.": "Passada tranquil·la i respiració profunda entre jugadors; la pilota no ha de tocar el terra.", "Decir el nombre antes de pasar.": "Dir el nom abans de passar.", "1 balón": "1 pilota", "Espejo en calma": "Mirall en calma", "Uno hace movimientos lentos de estiramiento y el otro los copia, como un espejo.": "Un fa moviments lents d'estirament i l'altre els copia, com un mirall.", "Cambiar de roles y añadir respiración.": "Canviar de rols i afegir respiració.", "Animales con balón": "Animals amb pilota", "Moverse como rana, cangrejo u oso empujando o rodando el balón sin perderlo. Cada animal dura 30 segundos.": "Moure's com una granota, un cranc o un ós empenyent o fent rodar la pilota sense perdre-la. Cada animal dura 30 segons.", "Cambiar de animal a la señal.": "Canviar d'animal al senyal.", "Bote a pasos de gigante": "Bot a passos de gegant", "Botar caminando con pasos grandes (gigante) y pasos pequeños (hormiga) siguiendo la voz del entrenador.": "Botar caminant amb passos grans (gegant) i passos petits (formiga) seguint la veu de l'entrenador.", "Botar con la otra mano.": "Botar amb l'altra mà.", "Rodar y pasar con dos manos": "Fer rodar i passar amb les dues mans", "A 2 metros, un pase de pecho suave o rodado al compañero, que recibe con las dos manos y devuelve.": "A 2 metres, una passada de pit suau o rodada al company, que rep amb les dues mans i torna.", "Alejar un paso cada 5 pases seguidos.": "Allunyar un pas cada 5 passades seguides.", "Lanzar al aro grande": "Llançar a l'anella gran", "Lanzar con dos manos a un aro en el suelo o a un cubo grande desde 1,5 metros, celebrando cada acierto.": "Llançar amb les dues mans a una anella a terra o a un cubell gran des d'1,5 metres, celebrant cada encert.", "Subir la altura del objetivo.": "Pujar l'alçada de l'objectiu.", "Aros de suelo, balones": "Anelles de terra, pilotes", "El ca {const c=k.charAt(0),low=c===c.toLowerCase(),alt=(low?c.toUpperCase():c.toLowerCase())+k.slice(1),r=CA[alt];if(alt!==k&&r!==undefined)return (low?r.charAt(0).toLowerCase():r.charAt(0).toUpperCase())+r.slice(1)}
for(const sep of [' · ',', ']){if(k.includes(sep)){const ps=k.split(sep),o=ps.map(p=>{const r=TR(p);return r===undefined?p:r});if(o.join('|')!==ps.join('|'))return o.join(sep)}}let r=k,ch=false;for(const[re,to]of CAR){const n=r.replace(re,to);if(n!==r){r=n;ch=true}}return ch?r:undefined};

function isoLocal(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fdmy(d){const x=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||'');return x?x[3]+'/'+x[2]+'/'+x[1]:''}
function gcore(g){const c=JSON.parse(JSON.stringify(g));delete c.hist;delete c.since;return c}
function gArchive(age,snapStr,snapSince){const g=GUIDE[age];if(!g||JSON.stringify(gcore(g))===snapStr)return false;const now=isoLocal();
if((snapSince||'')!==now)g.hist=[...(g.hist||[]),{from:snapSince||'',to:now,g:JSON.parse(snapStr)}];
g.since=now;GS[age]=JSON.parse(JSON.stringify(g));persist();return true}

const CP={'’':0x92,'‘':0x91,'“':0x93,'”':0x94,'–':0x96,'—':0x97,'…':0x85,'•':0x95,'€':0x80};
function cpStr(s){let o='';for(const ch of String(s)){const c=ch.charCodeAt(0);if(CP[ch])o+=String.fromCharCode(CP[ch]);else if(c===10||c===13||c===9)o+=' ';else if(c<256&&(c>=32))o+=ch;else o+='?'}return o}

const PDFC={ink:[.08,.13,.24],mut:[.36,.4,.47],acc:[.91,.45,.11],r:[.84,.27,.27],y:[.9,.65,.04],g:[.18,.62,.36]};
function pdfMeasure(){const c=document.createElement('canvas').getContext('2d');return(t,sz,b)=>{c.font=(b?'bold ':'')+sz+'px Helvetica, Arial, sans-serif';return c.measureText(cpStr(t)).width}}
function pdfWrap(m,text,sz,w,b){const out=[];String(text||'').split(/\n/).forEach(par=>{const words=par.split(/\s+/).filter(Boolean);let line='';
for(const wd of words){const t=line?line+' '+wd:wd;if(m(t,sz,b)<=w||!line)line=t;else{out.push(line);line=wd}}out.push(line)});return out}
function svgToJpeg(svg,w,h){return new Promise((res,rej)=>{const V={'--ink':'#14213D','--wood':'#F1E2C6','--surface':'#FFFFFF','--accent':'#E8741C','--court':'#2F7D6B','--bg':'#EEF2F4','--line':'#D5DCE3','--muted':'#5B6578'};
let x=svg.replace(/var\((--[a-z-]+)\)/g,(m,k)=>V[k]||'#14213D').replace('<svg ',`<svg xmlns="http:/${"/"}www.w3.org/2000/svg" width="${w}" height="${h}" `);
const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#F1E2C6';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
const b=atob(c.toDataURL('image/jpeg',.92).split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);res(u)};
img.onerror=()=>rej(new Error('img'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x)})}
